                    <label class="filter-item">

                    <div class="filter-group__icon filter-group__icon--locations">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>

                    </div>

                    <svg class="filter-group__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <div id="map" class="map-container"></div>

    <div class="coordinates" id="coordinates">
        <span class="coordinates__label">X:</span>
        <span class="coordinates__value" id="coordX">0</span>
        <span class="coordinates__label">Y:</span>
        <span class="coordinates__value" id="coordY">0</span>
    </div>

    <div class="level-switcher" id="levelSwitcher">
        <button class="level-switcher__btn level-switcher__btn--active" data-level="surface" id="levelSurface">
            <svg class="level-switcher__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/>
            </svg>
            <span data-i18n="map.level.surface">Поверхность</span>
        </button>
        <button class="level-switcher__btn" data-level="underground" id="levelUnderground">
            <svg class="level-switcher__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 7h18M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/>
                <path d="M8 11h2v2H8zM14 11h2v2h-2z"/>
                <path d="M10 15h4"/>
            </svg>
            <span data-i18n="map.level.underground">Подземелье</span>
        </button>
    </div>

    <div class="map-controls">
        <button class="map-control" id="zoomIn" data-title-i18n="map.controls.zoomIn" title="Приблизить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6M8 11h6"/>
            </svg>
        </button>
        <button class="map-control" id="zoomOut" data-title-i18n="map.controls.zoomOut" title="Отдалить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6"/>
            </svg>
        </button>
        <button class="map-control" id="resetView" data-title-i18n="map.controls.resetView" title="Сбросить вид">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
        </button>
        <button class="map-control" id="fullscreen" data-title-i18n="map.controls.fullscreen" title="Полноэкранный режим">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
        </button>
    </div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span data-i18n="map.toast.copied">Скопировано в буфер обмена!</span>
