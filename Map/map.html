<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Интерактивная карта — Project Cataclysm Wiki</title>
    <link rel="icon" href="../favicon.png" type="image/png">
    <meta name="keywords" content="Project Cataclysm карта, интерактивная карта Project Cataclysm, ящики Project Cataclysm, мутанты Project Cataclysm">
    <meta name="description" content="Интерактивная карта Project Cataclysm. Ящики с лутом, точки спавна мутантов, торговцы и другие метки.">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="map.css">
</head>
<body>
    <header class="header">
        <div class="header__container">
            <a href="../index.html" class="header__logo">
                <span class="header__logo-text">CATACLYSM<span class="header__logo-accent">WIKI</span></span>
            </a>
            <nav class="header__nav">
                <a href="../index.html" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Главная
                </a>
                <span class="nav-link nav-link--current">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4-7 4z"/><path d="M8 2v16"/><path d="M16 6v16"/>
                    </svg>
                    Карта
                </span>
                <a href="../Table/table.html" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    Артефакты
                </a>
                <a href="../Calculator/calculator.html" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/>
                    </svg>
                    Калькулятор
                </a>
                <a href="../DPS/dps.html" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                    </svg>
                    DPS
                </a>
            </nav>
            <button class="header__burger" id="burger"><span></span><span></span><span></span></button>
        </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
        <nav class="mobile-menu__nav">
            <a href="../index.html" class="mobile-menu__link">Главная</a>
            <span class="mobile-menu__link mobile-menu__link--current">Интерактивная карта</span>
            <a href="../Table/table.html" class="mobile-menu__link">Таблица артефактов</a>
            <a href="../Calculator/calculator.html" class="mobile-menu__link">Калькулятор сборок</a>
            <a href="../DPS/dps.html" class="mobile-menu__link">Калькулятор DPS</a>
        </nav>
    </div>

    <!-- Sidebar с фильтрами -->
    <aside class="sidebar" id="sidebar">
        <button class="sidebar__toggle" id="sidebarToggle" title="Свернуть/развернуть">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>
        
        <div class="sidebar__content">
            <div class="sidebar__header">
                <h2 class="sidebar__title">Фильтры</h2>
                <button class="sidebar__reset" id="resetFilters" title="Сбросить всё">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
                    </svg>
                </button>
            </div>

            <!-- Категория: Контейнеры -->
            <div class="filter-group" data-category="containers">
                <button class="filter-group__header">
                    <div class="filter-group__icon filter-group__icon--containers">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                        </svg>
                    </div>
                    <span class="filter-group__title">Контейнеры</span>
                    <span class="filter-group__count" id="countContainers">0</span>
                    <svg class="filter-group__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </button>
                <div class="filter-group__content">
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="ammo" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Патроны</span>
                        <span class="filter-item__count" data-count="ammo">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="supply" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Припасы</span>
                        <span class="filter-item__count" data-count="supply">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="tools" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Инструменты</span>
                        <span class="filter-item__count" data-count="tools">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="barrels" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Бочки</span>
                        <span class="filter-item__count" data-count="barrels">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="science" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Научное оборудование</span>
                        <span class="filter-item__count" data-count="science">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="stash" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Тайники</span>
                        <span class="filter-item__count" data-count="stash">0</span>
                    </label>
                </div>
            </div>

            <!-- Категория: Мутанты -->
            <div class="filter-group" data-category="mutants">
                <button class="filter-group__header">
                    <div class="filter-group__icon filter-group__icon--mutants">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
                        </svg>
                    </div>
                    <span class="filter-group__title">Мутанты</span>
                    <span class="filter-group__count" id="countMutants">0</span>
                    <svg class="filter-group__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </button>
                <div class="filter-group__content">
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="blind_dog" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Слепые псы</span>
                        <span class="filter-item__count" data-count="blind_dog">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="pseudodog" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Псевдособаки</span>
                        <span class="filter-item__count" data-count="pseudodog">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="flesh" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Плоти</span>
                        <span class="filter-item__count" data-count="flesh">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="boar" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Кабаны</span>
                        <span class="filter-item__count" data-count="boar">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="rat" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Крысы</span>
                        <span class="filter-item__count" data-count="rat">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="snork" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Снорки</span>
                        <span class="filter-item__count" data-count="snork">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="zombie" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Зомби</span>
                        <span class="filter-item__count" data-count="zombie">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="bloodsucker" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Кровосос</span>
                        <span class="filter-item__count" data-count="bloodsucker">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="bloodsucker_strong" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Матёрый кровосос</span>
                        <span class="filter-item__count" data-count="bloodsucker_strong">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="chimera" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Химера</span>
                        <span class="filter-item__count" data-count="chimera">0</span>
                    </label>
                </div>
            </div>

            <!-- Категория: Торговцы -->
            <div class="filter-group" data-category="traders">
                <button class="filter-group__header">
                    <div class="filter-group__icon filter-group__icon--traders">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                        </svg>
                    </div>
                    <span class="filter-group__title">Торговцы</span>
                    <span class="filter-group__count" id="countTraders">0</span>
                    <svg class="filter-group__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </button>
                <div class="filter-group__content">
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="trader" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Маклак</span>
                        <span class="filter-item__count" data-count="trader">0</span>
                    </label>
                </div>
            </div>

            <!-- Категория: НПС -->
            <div class="filter-group" data-category="npc">
                <button class="filter-group__header">
                    <div class="filter-group__icon filter-group__icon--npc">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <span class="filter-group__title">НПС</span>
                    <span class="filter-group__count" id="countNpc">0</span>
                    <svg class="filter-group__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </button>
                <div class="filter-group__content">
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="zombified" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Зомбированные</span>
                        <span class="filter-item__count" data-count="zombified">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="bandits" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Бандиты</span>
                        <span class="filter-item__count" data-count="bandits">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="military" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Военные</span>
                        <span class="filter-item__count" data-count="military">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="freedom" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Свободовцы</span>
                        <span class="filter-item__count" data-count="freedom">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="duty" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Долговцы</span>
                        <span class="filter-item__count" data-count="duty">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="mercs" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Наемники</span>
                        <span class="filter-item__count" data-count="mercs">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="sins" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Греховцы</span>
                        <span class="filter-item__count" data-count="sins">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="monolith" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Монолитовцы</span>
                        <span class="filter-item__count" data-count="monolith">0</span>
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" class="filter-checkbox" data-filter="obliterator" checked>
                        <span class="filter-item__checkmark"></span>
                        <span class="filter-item__label">Облитератор</span>
                        <span class="filter-item__count" data-count="obliterator">0</span>
                    </label>
                </div>
            </div>
        </div>
    </aside>

    <!-- Контейнер карты -->
    <div id="map" class="map-container"></div>

    <!-- Координаты курсора -->
    <div class="coordinates" id="coordinates">
        <span class="coordinates__label">X:</span>
        <span class="coordinates__value" id="coordX">0</span>
        <span class="coordinates__label">Y:</span>
        <span class="coordinates__value" id="coordY">0</span>
    </div>

    <!-- Кнопки управления -->
    <div class="map-controls">
        <button class="map-control" id="zoomIn" title="Приблизить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M11 8v6M8 11h6"/>
            </svg>
        </button>
        <button class="map-control" id="zoomOut" title="Отдалить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6"/>
            </svg>
        </button>
        <button class="map-control" id="resetView" title="Сбросить вид">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
        </button>
        <button class="map-control" id="fullscreen" title="Полноэкранный режим">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="mapData.js"></script>
    <script src="map.js"></script>
</body>
</html>
