<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64" viewBox="0 0 64 64"
     role="img" aria-labelledby="title desc">
  <title id="title">Project Cataclysm Wiki — favicon</title>
  <desc id="desc">Стилизованный знак радиации в цветах Project Cataclysm</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="60%" stop-color="#050506"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b86a"/>
      <stop offset="100%" stop-color="#c4a35a"/>
    </linearGradient>

    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e3a4"/>
      <stop offset="100%" stop-color="#8b7a4a"/>
    </linearGradient>

    <path id="blade" d="
      M24.5 19
      L19 9.5
      A26 26 0 0 1 45 9.5
      L39.5 19
      A15 15 0 0 0 24.5 19
      Z" />
  </defs>

  <circle cx="32" cy="32" r="30"
          fill="url(#bg)"
          stroke="url(#ring)"
          stroke-width="2.5" />

  <g fill="url(#accent)" stroke="#000000" stroke-width="1">
    <use href="#blade" />
    <use href="#blade" transform="rotate(120 32 32)" />
    <use href="#blade" transform="rotate(240 32 32)" />
  </g>

  <circle cx="32" cy="32" r="5.5"
          fill="url(#accent)"
          stroke="#000000"
          stroke-width="1" />

  <circle cx="32" cy="32" r="22"
          fill="none"
          stroke="#000000"
          stroke-opacity="0.6"
          stroke-width="1" />
</svg>